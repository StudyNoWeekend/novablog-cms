app:
  name: cus-cms
  env: development
  debug: true

http:
  port: 8111
  read_timeout: 30s
  write_timeout: 30s

log:
  level: debug
  file_path: logs/app.log
  max_size: 100
  max_backups: 10
  max_age: 30

postgres:
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: "<your-postgres-password>"
  dbname: cus_cms
  sslmode: disable
  max_open_conns: 100
  max_idle_conns: 10

redis:
  host: 127.0.0.1
  port: 6379
  password: "<your-redis-password>"
  db: 3

upload:
  dir: ./uploads                  # 本地存储目录
  base_url: http://localhost:8080 # 访问基础URL

jwt:
  access_secret: "<your-access-secret-key>"
  refresh_secret: "<your-refresh-secret-key>"
  access_expire: 2h
  refresh_expire: 168h

crypto:
  secret_key: "<a-random-32-char-secret-key>"

# upload 段保留（作为迁移只读源，不再用于新上传）
