name: Release

# 推送 v* 标签（或手动触发）时：
#   1. 构建 linux/amd64 + linux/arm64 单镜像并推送到 GHCR
#   2. 用 .github/release-notes/<版本号>.md 作为正文创建 GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 v1.0.0，需与仓库中已存在的 tag 一致）"
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  # GHCR 镜像名（全小写）。注意：本仓库名为 novablog-admin，与同账号下另一项目
  # （StudyNoWeekend/novablog 的后台前端镜像）同名，为避免覆盖其已发布镜像，
  # 这里固定使用 novablog-cms 作为本项目的镜像名。
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/novablog-cms

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 解析版本号与 Release 正文
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [ -f ".github/release-notes/${VERSION}.md" ]; then
            echo "notes=.github/release-notes/${VERSION}.md" >> "$GITHUB_OUTPUT"
          fi
          echo "构建版本：${VERSION}"

      - name: 准备 QEMU（多架构）
        uses: docker/setup-qemu-action@v3

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: tags
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          # 仓库名可能含大写，镜像引用必须全小写
          REPO_LC="$(printf '%s' "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')"
          TAGS="${REPO_LC}:${VERSION}"
          # 预发布版本（含 -）不更新 latest
          case "$VERSION" in
            *-*) ;;
            *) TAGS="${TAGS}"$'\n'"${REPO_LC}:latest" ;;
          esac
          {
            echo "tags<<EOF"
            echo "$TAGS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "镜像标签："
          echo "$TAGS"

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: NovaBlog CMS ${{ steps.meta.outputs.version }}
          body_path: ${{ steps.meta.outputs.notes }}
          generate_release_notes: true
          draft: false
