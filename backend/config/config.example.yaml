# NovaBlog CMS 后端配置（config.yaml）
#
# 本文件只保留【启动前置】配置：数据库/Redis 连接、HTTP 端口、日志、JWT/加密密钥——
# 这些必须在数据库可用之前读取。
#
# ★ 运行时配置（站点对外地址、出网代理、GitHub Token、存储、跨域、地图、模块开关、
#   安全参数、云盘凭据与限额等）的唯一主源是【数据库】，统一在管理后台
#   「系统配置」维护并即时生效；本文件中的同名旧键已不再读取
#   （存量部署升级后由启动种子逻辑自动导入数据库，旧键原样保留无害）。
#
# 标注 [播种] 的键：首次启动时作为对应数据库配置的初始值导入，此后以数据库为准。

app:
  name: backend
  env: development
  debug: true

http:
  port: 8111
  read_timeout: 30s
  # 写超时放宽到 10 分钟：主题安装/更新需从 GitHub 下载制品，同步接口可能耗时较长；
  # 正常接口毫秒级返回不受影响
  write_timeout: 600s

log:
  level: debug
  file_path: logs/app.log
  max_size: 100
  max_backups: 10
  max_age: 30

postgres:
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: "<your-postgres-password>"
  dbname: novablog
  sslmode: disable
  max_open_conns: 100
  max_idle_conns: 10

redis:
  host: 127.0.0.1
  port: 6379
  password: "<your-redis-password>"
  db: 3

upload:
  dir: ./uploads                   # 本地存储目录（容器部署时与挂载卷一一对应）
  base_url: http://localhost:8111  # [播种] 站点对外地址首装默认值，导入 system_configs.site_url 后以数据库为准

jwt:
  access_secret: "<your-access-secret-key>"
  refresh_secret: "<your-refresh-secret-key>"
  access_expire: 2h
  refresh_expire: 168h

crypto:
  secret_key: "<a-random-32-char-secret-key>"

# 官方部署安装码：非空时，首装初始化必须携带该密钥（防止知道地址的人恶意抢先初始化）；
# 自部署留空即不启用校验。官方部署由 deploy.sh --install-code 自动生成写入，随邮件发给用户
install:
  init_code: ""

# IP 归属地解析（访问统计"地区"列）：基于 ip2region 离线数据，不依赖外部 API
# - data_dir 下缺失 ip2region_v4.xdb 时自动下载；下载/加载失败仅降级（地区列显示"未知"），不影响服务
# - 下载地址与代理为运行时配置（管理后台「系统配置-站点信息」维护），此处不再配置
geoip:
  data_dir: ./data/geoip

# [播种] NovaBlog 官方站点地址：社区推送与主题市场统一入口的首次启动默认值，
# 导入 community_push_configs.base_url 后以后台「社区推送配置」页为准
community:
  base_url: "http://api.novablog.cn"

# 博客主题模块（本段仅保留容器路径约定；token/代理/API 地址/下载上限为运行时配置，走数据库）
themes:
  data_dir: ./data/themes            # 主题制品解压根目录
  frontend_dir: ""                   # 自备博客前端目录（含 theme.json 与 dist/，与主题制品包同构）；非空时优先于已安装主题，空=使用后台安装的主题

# [播种] 跨域白名单首次启动默认值，导入 cors_configs 后以后台「跨域配置」页为准
cors:
  allowed_origins: "http://localhost:5173,http://localhost:5174,https://www.novablog.cn,https://api.novablog.cn"
