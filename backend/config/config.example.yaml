app:
  name: backend
  env: development
  debug: true

http:
  port: 8111
  read_timeout: 30s
  # 写超时放宽到 10 分钟：主题安装/更新需从 GitHub 下载制品，同步接口可能耗时较长；
  # 正常接口毫秒级返回不受影响
  write_timeout: 600s

log:
  level: debug
  file_path: logs/app.log
  max_size: 100
  max_backups: 10
  max_age: 30

postgres:
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: "<your-postgres-password>"
  dbname: novablog
  sslmode: disable
  max_open_conns: 100
  max_idle_conns: 10

redis:
  host: 127.0.0.1
  port: 6379
  password: "<your-redis-password>"
  db: 3

upload:
  dir: ./uploads                   # 本地存储目录
  base_url: http://localhost:8111  # 本地文件访问基础URL（需与 http.port 一致）

jwt:
  access_secret: "<your-access-secret-key>"
  refresh_secret: "<your-refresh-secret-key>"
  access_expire: 2h
  refresh_expire: 168h

crypto:
  secret_key: "<a-random-32-char-secret-key>"

security:
  enabled: true
  blacklist_ttl_minutes: 60
  log_retention_days: 7

# 博客主题（模板）模块：安装/切换/静态托管
themes:
  data_dir: ./data/themes            # 主题制品解压根目录
  frontend_dir: ""                   # 自备博客前端目录（含 theme.json 与 dist/，与主题制品包同构）；非空时优先于已安装主题，空=使用后台安装的主题
  market_base_url: "http://novablogapi.ditancafebar.cn" # 官方主题市场地址（出厂默认值；首装向导/市场登录/后台修改后会持久化到 DB 并覆盖此值，服务端直连）
  github_token: ""                   # 可选 GitHub PAT（提升 Release 查询限流额度）
  public_api_base: ""                # 跨域部署时注入 theme-config.js 的 apiBase；空=同域相对路径
  max_artifact_mb: 100               # 制品下载上限（MB）

# 跨域配置（后台页面可动态修改，此值为首次启动默认值）
cors:
  allowed_origins: "http://localhost:5173,http://localhost:5174"

# upload 段同时用于本地存储和迁移只读源
