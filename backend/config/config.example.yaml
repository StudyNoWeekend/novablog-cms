app:
  name: backend
  env: development
  debug: true

http:
  port: 8111
  read_timeout: 30s
  write_timeout: 30s

log:
  level: debug
  file_path: logs/app.log
  max_size: 100
  max_backups: 10
  max_age: 30

postgres:
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: "<your-postgres-password>"
  dbname: novablog
  sslmode: disable
  max_open_conns: 100
  max_idle_conns: 10

redis:
  host: 127.0.0.1
  port: 6379
  password: "<your-redis-password>"
  db: 3

upload:
  dir: ./uploads                   # 本地存储目录
  base_url: http://localhost:8111  # 本地文件访问基础URL（需与 http.port 一致）

jwt:
  access_secret: "<your-access-secret-key>"
  refresh_secret: "<your-refresh-secret-key>"
  access_expire: 2h
  refresh_expire: 168h

crypto:
  secret_key: "<a-random-32-char-secret-key>"

security:
  enabled: true
  blacklist_ttl_minutes: 60
  log_retention_days: 7

# upload 段同时用于本地存储和迁移只读源
