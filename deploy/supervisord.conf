; NovaBlog 单镜像进程管理：nginx（统一入口）+ Go 后端（127.0.0.1:8111）
; 容器内以 root 运行：nginx 需绑定 80 端口，且需兼容用户在宿主机指定的任意挂载目录权限。

[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0

[program:backend]
command=/app/novablog /app/config/config.yaml
directory=/app
autorestart=true
startsecs=3
startretries=10
stopwaitsecs=15
stopsignal=TERM
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autorestart=true
startsecs=2
stopwaitsecs=10
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
