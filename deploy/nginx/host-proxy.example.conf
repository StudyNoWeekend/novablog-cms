# NovaBlog 外层（宿主机）nginx 反代示例
#
# 适用场景：宿主机已有 nginx（承载主域名），为 NovaBlog 的两个入口各加一个 server 块，
# 将二级域名反代到 deploy.sh 映射出的宿主端口。容器内自带 nginx，宿主机无需额外安装。
#
# 使用方法：
#   1. 按实际域名与端口修改下方 server_name / proxy_pass
#   2. 拷贝到 /etc/nginx/conf.d/（或 include 到主配置）
#   3. nginx -t && nginx -s reload
#
# deploy.sh 对应填法：
#   博客前端端口: 9001            → proxy_pass http://127.0.0.1:9001
#   CMS 后台端口: 9002            → proxy_pass http://127.0.0.1:9002
#   博客对外访问地址: http://blog.example.com   （访客实际访问地址，走反代时不带端口！）
#   博客入口域名 / 后台入口域名: 填裸域名（不带 http://）
#
# 注意：
#   - client_max_body_size 必须调大（nginx 默认 1m）：媒体分片上传、主题制品安装（最大 100MB）
#     都会超限报 413，本示例按主题上限的两倍余量设为 200m
#   - 安全组/防火墙无需对公网开放 9001/9002，反代仅走本机回环，对外只保留 80/443
#   - 后续上 HTTPS：证书配在本层，443 server 块同理反代；生效后重跑 deploy.sh 将
#     「博客对外访问地址」改为 https://blog.example.com（媒体 URL 随协议切换）
#
# 排错提示：
#   - 反代返回 502 时先确认容器内 Go 后端是否存活（./deploy.sh --logs 或 docker logs）：
#     内层 nginx 正常但后端未监听 8111 时，所有请求都会 502，与外层配置无关
#   - WebSocket / SSE 场景必须保留下方 proxy_http_version 1.1 与 Upgrade/Connection 头，
#     否则外层默认以 HTTP/1.0 回源，长连接会被截断

# WebSocket 升级映射（conf.d 会在 http 上下文加载，此处顶层 map 即可）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- 博客前台（访客入口）----
server {
    listen 80;
    server_name blog.example.com;          # 改为你的博客域名

    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:9001;  # 改为你的博客端口
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket / SSE / 流式接口：升级头 + 关闭缓冲，长连接不被截断
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# ---- CMS 管理后台 ----
server {
    listen 80;
    server_name cms.example.com;           # 改为你的后台域名

    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:9002;  # 改为你的后台端口
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }
}

# ---- 博客公开 API（可选：独立 API 域名，只暴露公开接口与媒体文件）----
# 使用步骤：
#   1. 该域名 A 记录解析到本机，DNS 生效后此 server 块即可工作（反代目标与博客入口相同）
#   2. 管理后台「主题 → 服务地址设置」填入 http://api.example.com 保存——
#      已安装主题会自动重新注入取数地址（theme-config.js），博客页面开始走该域名取数
#   3. 后台保存的地址同时持久化到数据库，重启不丢失
# 安全说明：只放行公开只读接口与媒体文件，不暴露后台管理 API 与页面；
#   切勿添加 location / 全量反代——Go 端会把未匹配路径兜底为主题静态页，等于把整站暴露在此域名下。
# CORS：博客页面跨域调用该域名，需博客域名在白名单内（deploy.sh 生成的 allowed_origins 已含博客对外地址）。
server {
    listen 80;
    server_name api.example.com;           # 改为你的 API 域名

    client_max_body_size 200m;

    # 公开接口（文章/评论/音乐/配置下发等；含免鉴权的首装引导接口）
    location /api/v1/public/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 媒体文件（文章配图、上传附件等）
    location /files/ {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    # 探活（可选）
    location = /health { proxy_pass http://127.0.0.1:9001; }
    location = /ready { proxy_pass http://127.0.0.1:9001; }

    # 其余路径一律 404（不放行后台 API、主题页面与预览）
    location / { return 404; }
}
