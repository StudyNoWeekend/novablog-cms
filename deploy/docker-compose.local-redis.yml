# 可选覆盖：内置 Redis（数据持久化到宿主机目录）
# 用法：docker compose -f docker-compose.yml -f docker-compose.local-redis.yml up -d
#
# 使用外部 Redis 时不要带上本文件；连接信息写在 config.yaml 的 redis 段。

services:
  novablog:
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 deploy/.env 中设置 REDIS_PASSWORD}"]
    volumes:
      - ${NOVABLOG_REDISDATA_DIR:-./data/redis}:/data
    networks:
      - novablog
