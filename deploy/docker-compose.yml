# NovaBlog 应用服务（单镜像：nginx 统一入口 + Go 后端 + 管理后台前端）
#
# 常用组合（推荐直接用部署脚本 ./deploy.sh，它会自动拼好下列参数并生成 .env / config.yaml）：
#   外部 PG/Redis：  docker compose up -d
#   内置 PG：        docker compose -f docker-compose.yml -f docker-compose.local-pg.yml up -d
#   内置 Redis：     docker compose -f docker-compose.yml -f docker-compose.local-redis.yml up -d
#   本地构建镜像：    docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# 变量取自 .env（cp .env.example .env 后修改），未设置时使用下方默认值。

name: novablog

services:
  novablog:
    image: ${NOVABLOG_IMAGE_REPO:-ghcr.io/studynoweekend/novablog-cms}:${NOVABLOG_VERSION:-latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 入口 server_name（本地/IP 访问用 _）
      NOVABLOG_DOMAIN: ${NOVABLOG_DOMAIN:-_}
      NOVABLOG_ADMIN_DOMAIN: ${NOVABLOG_ADMIN_DOMAIN:-_}
      # 容器内监听端口/路径（改动时需同步修改端口映射右侧）
      NOVABLOG_ADMIN_PORT: ${NOVABLOG_ADMIN_CONTAINER_PORT:-8080}
      NOVABLOG_ADMIN_BASE: ${NOVABLOG_ADMIN_BASE:-/admin/}
    ports:
      # 博客前端端口 → 容器 :80
      - "${NOVABLOG_HTTP_PORT:-80}:80"
      # CMS 后台端口 → 容器 :8080
      - "${NOVABLOG_ADMIN_HTTP_PORT:-8080}:${NOVABLOG_ADMIN_CONTAINER_PORT:-8080}"
    volumes:
      # 后端配置（./deploy.sh 生成；字段说明见 backend/config/config.example.yaml）
      - ${NOVABLOG_CONFIG_DIR:-./config}/config.yaml:/app/config/config.yaml:ro
      # 媒体上传目录
      - ${NOVABLOG_UPLOADS_DIR:-./data/uploads}:/app/uploads
      # 主题制品目录（后台安装/切换的主题）
      - ${NOVABLOG_THEMES_DIR:-./data/themes}:/app/data/themes
      # IP 归属地数据目录（ip2region xdb 缓存，容器重建后无需重新下载）
      - ${NOVABLOG_GEOIP_DIR:-./data/geoip}:/app/data/geoip
      # 日志目录
      - ${NOVABLOG_LOGS_DIR:-./data/logs}:/app/logs
      # 自备博客前端目录（含 theme.json 与 dist/，与主题制品包同构）
      # 目录为空时后端自动回退到后台安装的主题，见 config.yaml 的 themes.frontend_dir
      - ${NOVABLOG_BLOG_FRONTEND_DIR:-./data/blog-frontend}:/app/blog-frontend:ro
    networks:
      - novablog

networks:
  novablog:
    driver: bridge
