name: novablog

services:
  # Go 后端：业务 API + 博客主题静态托管（激活主题）+ 首装初始化
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: novablog-backend:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      # 本地部署配置：postgres/redis 主机已改为服务名
      - ./config.yaml:/app/config/config.yaml:ro
      - themes_data:/app/data/themes
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - novablog

  # nginx 统一入口（双端口）：:80 博客页面；:8080 管理后台（可独立做访问控制/不映射）
  nginx:
    build:
      context: ..
      dockerfile: deploy/nginx.Dockerfile
    image: novablog-nginx:latest
    restart: unless-stopped
    ports:
      - "${NOVABLOG_HTTP_PORT:-80}:80"
      - "${NOVABLOG_ADMIN_HTTP_PORT:-8080}:8080"
    environment:
      NOVABLOG_DOMAIN: ${NOVABLOG_DOMAIN:-_}
      NOVABLOG_ADMIN_DOMAIN: ${NOVABLOG_ADMIN_DOMAIN:-_}
    depends_on:
      - backend
    networks:
      - novablog

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-novablog}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-novablog}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - novablog

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 deploy/.env 中设置 REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - novablog

volumes:
  pg_data:
  redis_data:
  # 主题制品解压目录（安装/切换状态持久化；内置兜底主题在镜像内 /app/data/themes-builtin）
  themes_data:
  uploads_data:

networks:
  novablog:
    driver: bridge
